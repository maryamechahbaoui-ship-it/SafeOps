version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ocp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Maryam@2005
      MYSQL_DATABASE: ocp_surete_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ocp_network

  backend:
    build: ./backend
    container_name: ocp_backend
    restart: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Maryam@2005
      - DB_NAME=ocp_surete_db
      - JWT_SECRET=supersecretkey_ocp_2026
    depends_on:
      - db
    networks:
      - ocp_network

  frontend:
    build: ./frontend
    container_name: ocp_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - IS_DOCKER=true
    depends_on:
      - backend
    networks:
      - ocp_network

volumes:
  mysql_data:

networks:
  ocp_network:
    driver: bridge
